# docker compose up -d                      -> http://localhost:8790
# docker compose --profile tunnel up -d     -> also runs a Cloudflare Tunnel (set TUNNEL_TOKEN in .env)
services:
  leaderboard:
    build: .
    restart: unless-stopped
    env_file:
      - path: config.env
        required: false
    environment:
      LB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - leaderboard-data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # put TUNNEL_TOKEN=... in a .env file next to this one
    depends_on:
      - leaderboard

volumes:
  leaderboard-data:
